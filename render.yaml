services:
  - type: web
    name: clearpay
    runtime: docker
    plan: free
    envVars:
      - key: LLM_PROVIDER
        value: api
      - key: LLM_BASE_URL
        value: https://agent-os-biz.adot.ai/oba/v1
      - key: LLM_MODEL
        value: skt/a.ll/A.X-K2-ADOT
      - key: LLM_API_KEY
        sync: false
      - key: WALLET_DONOR1_KEY
        sync: false
      - key: WALLET_DONOR2_KEY
        sync: false
      - key: WALLET_CHARITY_KEY
        sync: false
      - key: WALLET_TAXOFFICE_KEY
        sync: false
      - key: WALLET_PARENT_KEY
        sync: false
      - key: WALLET_FREELANCER_KEY
        sync: false
      - key: VP_DIR
        value: /opt/maroo
